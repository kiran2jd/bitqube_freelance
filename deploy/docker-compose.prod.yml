# Production Docker Compose for BitQube Freelance Marketplace
# Reference: docs/DEPLOYMENT_RUNBOOK.md

services:
  caddy:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
      args:
        VITE_API_URL: /api/v1
    container_name: bitqube_web_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-bitqube.org}
      ACME_EMAIL: ${ACME_EMAIL:-admin@bitqube.org}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - bitqube-edge-net
      - bitqube-internal-net

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    container_name: bitqube_backend_prod
    restart: always
    env_file:
      - ../.env
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-bitqube_prod}
      SYNC_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-bitqube_prod}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bitqube-edge-net
      - bitqube-internal-net

  postgres:
    image: postgres:16-alpine
    container_name: bitqube_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-bitqube_prod}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-bitqube_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - bitqube-internal-net
    # Security: Database port 5432 is strictly private and NOT published to the host

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  uploads_data:

networks:
  bitqube-edge-net:
    driver: bridge
  bitqube-internal-net:
    driver: bridge
    internal: true
